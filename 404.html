<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex">
  <title>Wrong stop · Onaway</title>
  <link rel="preload" href="/fonts/InstrumentSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/OverpassMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <script type="module" src="/src/js/main.js"></script>
</head>
<body>
  {{> nav}}

  <main id="main" class="notfound grid-site">
    <div class="col-span-full lg:col-span-8">
      <p class="label">Error 404 · Off the route</p>
      <h1 class="notfound__title text-h1 lg:text-display uppercase">Wrong stop.</h1>
      <p class="notfound__lead text-lead">That page isn’t on our route. Head back to the start, or tell us what you need and we’ll take it from there.</p>
      <div class="notfound__actions">
        <a class="notfound__home" href="/">Back to the homepage <span aria-hidden="true">→</span></a>
        <a class="notfound__quote" href="/#quote">Get a free quote <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </main>

  {{> footer}}
</body>
</html>
