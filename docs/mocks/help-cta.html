<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help CTA Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Overpass+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
/* HE-02 Help page closing CTA, round 4 (Nov 2026). Direct: the question, "Call us. A person answers, 8 AM – 8 PM, every
   day.", Call and Email us. Stop flag and Desk retired.
   The head sign (H3, N4) is one size, 240 × 55, as a label or as dots; the dots are the homepage's (the Services cards'
   5 × 7 face, the whole field of unlit dots filling the plate), lit in the colour its plate allows: yellow on Carbon,
   Carbon on Paper, Paper on Rust. Head colour is its own option. N4 compact joins the head sign to the card as one
   piece. N1 takes the card heights too. Review tools: style · plate colour · head colour · head · card · view and
   angle · desk · device. Scores 0–100 in the panel. */
:root{--ink:#202521;--pap:#F7F2E7;--ye:#E4BB3F;--ru:#A9503E;--ca:#B49A78;--face:color-mix(in srgb,#202521 5%,#F7F2E7);--edge:color-mix(in srgb,#202521 80%,#B49A78);--line:rgba(32,37,33,.2)}
.stage{height:860px;container-type:inline-size;position:relative}
.dev-phone .wrap{max-width:390px}.dev-phone .stage{width:390px;height:1000px}
svg.ic{width:1em;height:1em;flex:none}
.top .tools{flex-wrap:wrap}

/* plate colour */
.stage{--pl:var(--face);--pi:var(--ink);--pm:rgba(32,37,33,.72);--fr:var(--ink);--bolt-c:rgba(32,37,33,.5);--tile:var(--pl)}
[data-col="yellow"]{--pl:var(--ye)}
[data-col="camel"]{--pl:var(--ca);--pm:rgba(32,37,33,.82)}
[data-col="rust"]{--pl:var(--ru);--pi:var(--pap);--pm:rgba(247,242,231,.84);--bolt-c:rgba(247,242,231,.45)}
[data-col="carbon"]{--pl:var(--ink);--pi:var(--pap);--pm:rgba(247,242,231,.72);--fr:#353a35;--bolt-c:rgba(247,242,231,.35)}
/* head colour: its plate, its ink (and the lit dots), the W's tile */
.stage{--hp:var(--ink);--hi:var(--ye);--hw:#353a35;--hf:inset 0 0 0 1px rgba(247,242,231,.1)}
[data-hc="paper"]{--hp:var(--face);--hi:var(--ink);--hw:var(--ink);--hf:inset 0 0 0 4px var(--ink)}
[data-hc="rust"]{--hp:var(--ru);--hi:var(--pap);--hw:var(--ink);--hf:inset 0 0 0 4px var(--ink)}
.sign{transform:perspective(2400px) rotateY(var(--ang,0deg));transition:transform .6s cubic-bezier(.3,.7,.3,1)}

/* the page around it */
.faq{position:absolute;left:64px;right:64px;top:21px}
.faq div{display:flex;justify-content:space-between;padding:21px 0;border-top:1px solid var(--line);font-size:20px;font-weight:600;font-stretch:87.5%}
.foot{position:absolute;left:0;right:0;bottom:0;height:89px;z-index:5;background:var(--ink);color:var(--pap);display:flex;align-items:center;padding:0 64px;font-size:26px;font-weight:500;font-stretch:87.5%}
.opt{position:absolute;left:0;right:0;top:178px;bottom:89px;display:none;padding:0 64px}
[data-o="p1"] .o-p1,[data-o="p3"] .o-p3,[data-o="h2"] .o-h2,[data-o="h3"] .o-h3,[data-o="n1"] .o-n1,[data-o="n4"] .o-n4{display:block}

/* ---------- parts ---------- */
.pl{position:relative;border-radius:13px;background:var(--pl);color:var(--pi);box-shadow:inset 0 0 0 8px var(--fr),0 2px 0 var(--edge),0 21px 34px -21px rgba(32,37,33,.45)}
.bolts{--b:radial-gradient(circle 2.5px,var(--bolt-c) 75%,transparent 85%);background:var(--b) var(--bx,10.6%) 21px/8px 8px no-repeat,var(--b) var(--bx,10.6%) calc(100% - 21px)/8px 8px no-repeat,var(--b) calc(100% - var(--bx,10.6%)) 21px/8px 8px no-repeat,var(--b) calc(100% - var(--bx,10.6%)) calc(100% - 21px)/8px 8px no-repeat,var(--pl)}
.w{position:absolute;left:0;top:0;width:55px;height:55px;display:grid;place-items:center;border-radius:13px 0 13px 0;background:var(--fr);color:var(--pap)}
.w svg{width:21px;height:auto}
.post{position:absolute;z-index:-1;width:21px;border-radius:21px 21px 0 0;background:linear-gradient(90deg,#4a4f48,var(--ink) 45%)}
.rod{position:absolute;width:4px;background:linear-gradient(90deg,#6a6e66,var(--ink) 55%)}
.rail{position:absolute;left:0;right:0;top:13px;height:8px;background:linear-gradient(180deg,#4a4f48,var(--ink) 60%)}
.ch{display:block;width:2px;background:var(--ink)}
.ch2{display:flex;justify-content:space-between}.ch2 i{width:2px;height:100%;background:var(--ink)}
.lab{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.q{font-family:var(--display);font-stretch:87.5%;font-weight:650;text-transform:uppercase;font-size:68px;line-height:.92;letter-spacing:-.01em;margin:0;text-wrap:balance}
.ld{font-size:20px;line-height:1.4;font-stretch:87.5%;color:var(--pm);margin:13px 0 0;max-width:30ch}
.cnt{display:grid;grid-template-columns:1fr auto;gap:55px;align-items:end}
.acts{display:flex;align-items:center;gap:34px}
.call{display:inline-flex;align-items:center;gap:13px;height:55px;padding:0 21px 0 0;background:var(--ink);color:var(--pap);font-size:20px;font-weight:600;font-stretch:87.5%;white-space:nowrap;cursor:pointer}
[data-col="carbon"] .pl .call{background:var(--pap);color:var(--ink)}
.call .ci{display:grid;place-items:center;width:55px;height:55px;font-size:21px;background:rgba(247,242,231,.08)}
[data-col="carbon"] .pl .call .ci{background:rgba(32,37,33,.06)}
.lk{display:inline-flex;align-items:center;gap:8px;font-size:20px;font-weight:600;font-stretch:87.5%;color:inherit;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px;cursor:pointer;white-space:nowrap}
.lk svg{font-size:21px}
.st{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.st i{width:8px;height:8px;border-radius:50%;background:var(--ye);box-shadow:0 0 0 3px rgba(228,187,63,.28)}
[data-s="closed"] .st i{background:var(--ca);box-shadow:none}
[data-s="open"] .closed,[data-s="closed"] .open{display:none}
@keyframes sway{from{rotate:-1.2deg}to{rotate:1.2deg}}

/* the head sign, one size either way: the W, then HELP DESK as a label or lit in dots across the whole field */
.hd{position:relative;z-index:1;display:flex;width:240px;height:55px;border-radius:8px;overflow:hidden;background:var(--hp);color:var(--hi);box-shadow:var(--hf),0 2px 0 var(--edge),0 13px 21px -13px rgba(32,37,33,.45)}
.hd .w{position:static;flex:none;border-radius:0;background:var(--hw)}
.hd-f{position:relative;flex:1;display:grid;place-items:center}
.hd-f .lab{color:var(--hi)}
[data-hc="carbon"] .hd-f .lab{color:var(--pap)}
.hd-f .dm{position:absolute;inset:0;display:none}
[data-hd="dots"] .hd-f .lab{display:none}
[data-hd="dots"] .hd-f .dm{display:block}
[data-hc="paper"] .hd-f .dm,[data-hc="rust"] .hd-f .dm{inset:4px 4px 4px 0}

/* the help point: the intercom card; the button is a metal bezel and a Carbon cap that presses; it glows on hover only */
.hp{position:relative;width:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:21px;padding:55px 34px 34px;border-radius:21px;cursor:pointer}
.hp .w{border-radius:21px 0 13px 0}
.hp-lab{font-family:var(--display);font-stretch:87.5%;font-weight:650;text-transform:uppercase;font-size:42px;line-height:.9;text-align:center}
.hp-grille{display:none;width:144px;height:55px;background:radial-gradient(circle 2.6px,var(--pi) 70%,transparent 80%) 0 0/13px 13px;opacity:.5}
.hp-btn{position:relative;display:grid;place-items:center;width:144px;height:144px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 30%,#eeeae0,#b9b4a8 62%,#8f8a7e);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 8px rgba(0,0,0,.22),0 2px 0 var(--edge);transition:box-shadow .35s}
.hp-btn b{display:grid;place-items:center;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 42% 30%,#3d433e,var(--ink) 62%);color:var(--pap);font-size:42px;
  box-shadow:0 5px 0 #0d0f0e,0 8px 13px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);transition:translate .15s,box-shadow .15s}
.hp-btn::after{content:"";position:absolute;inset:-13px;border-radius:50%;box-shadow:0 0 0 2px var(--ye);opacity:0;pointer-events:none}
.key:hover .hp-btn{box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 8px rgba(0,0,0,.22),0 2px 0 var(--edge),0 0 34px 6px rgba(228,187,63,.55)}
.key:hover .hp-btn::after{animation:ring 1.6s ease-out infinite}
.key:hover .hp-btn b{translate:0 2px;box-shadow:0 3px 0 #0d0f0e,0 5px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.14)}
.key:active .hp-btn b{translate:0 5px;box-shadow:0 0 0 #0d0f0e,0 2px 4px rgba(0,0,0,.3)}
@keyframes ring{0%{opacity:.9;scale:.9}100%{opacity:0;scale:1.18}}
.hp-say{font-size:16px;font-weight:600;font-stretch:87.5%;text-align:center}
.hp-say small{display:flex;justify-content:center;gap:8px;margin-top:8px;font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.06em;color:var(--pm)}
.hp-say .st{color:var(--pi)}
/* the keys: call, and (Email: second key) a smaller key beside it; each labelled under */
.keys{display:flex;align-items:flex-end;justify-content:center;gap:34px}
.key{display:flex;flex-direction:column;align-items:center;gap:13px;cursor:pointer}
.kl{font-size:16px;font-weight:600;font-stretch:87.5%}
.hp-btn.sm{width:89px;height:89px}.hp-btn.sm b{width:63px;height:63px;font-size:26px;box-shadow:0 4px 0 #0d0f0e,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.hp-btn.sm::after{inset:-8px}
.num{display:none;margin-top:-8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--pm)}
[data-ln="number"] .num{display:block}
.k-mail,.em-link{display:none}
.em-link{font-size:16px;color:var(--pi)}
[data-em="key"] .k-mail{display:flex}
[data-em="link"] .em-link{display:inline-flex}
[data-em="key"] .cp-mail,[data-em="link"] .cp-mail{display:none}
/* the lamp: the desk's status without words, yellow while someone's in */
.lamp{display:none;position:absolute;right:21px;top:21px;width:13px;height:13px;border-radius:50%;background:var(--ye);box-shadow:0 0 0 3px rgba(228,187,63,.25),0 0 13px rgba(228,187,63,.7)}
[data-lamp="on"] .lamp{display:block}
[data-s="closed"] .lamp{background:#6d6a62;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
/* card height (the width stays 340): compact (the button and the number), regular (+ its name), tall (+ the grille) */
[data-sz="s"] .hp{padding:34px 34px 21px;gap:13px}
[data-sz="s"] .hp-lab{display:none}
[data-sz="s"] .hp-btn{width:110px;height:110px}[data-sz="s"] .hp-btn b{width:80px;height:80px;font-size:34px}
[data-sz="s"] .hp-btn.sm{width:76px;height:76px}[data-sz="s"] .hp-btn.sm b{width:54px;height:54px;font-size:21px}
[data-sz="l"] .hp-grille{display:block;height:89px}

/* ---------- P1 · Pylon ---------- */
.o-p1 .sign{position:relative;isolation:isolate;margin:21px 144px 0}
.o-p1 .post{top:-34px;height:900px}.o-p1 .post.a{left:10%}.o-p1 .post.b{right:10%}
.p1-a{padding:89px 89px 55px}
.p1-b{margin-top:21px;display:flex;align-items:center;justify-content:space-between;height:55px;padding:0 89px;--pl:var(--ink);background:var(--ink);color:var(--pap);--fr:#353a35}
.p1-b .lab{color:rgba(247,242,231,.6)}.p1-b .st{color:var(--ye)}

/* ---------- P3 · Tiers ---------- */
.o-p3 .sign{position:relative;isolation:isolate;width:980px;margin:0 auto}
.o-p3 .post{top:-34px;height:900px}.o-p3 .post.a{left:12%}.o-p3 .post.b{right:12%}
.p3-a{--bx:12.6%;padding:89px 89px 55px}
.p3-row{margin-top:13px;display:grid;grid-template-columns:55px 1fr auto 21px;align-items:center;gap:21px;height:68px;padding:0 34px 0 8px;cursor:pointer;transition:translate .2s}
.p3-row .ri{display:grid;place-items:center;width:52px;height:52px;font-size:26px}
.p3-row b{font-size:26px;font-weight:600;font-stretch:87.5%}
.p3-row em{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--pm)}
.p3-row>svg{font-size:21px}
.p3-row.call-row{--pl:var(--ink);--pi:var(--pap);--pm:rgba(247,242,231,.65);--fr:var(--ink)}
[data-col="carbon"] .p3-row.call-row{--pl:var(--pap);--pi:var(--ink);--pm:rgba(32,37,33,.65);--fr:var(--pap)}
.p3-row:hover{translate:4px 0}

/* ---------- H2 · Pair ---------- */
.o-h2 .sign{position:relative;display:grid;grid-template-columns:1fr 360px;gap:34px;margin:89px 89px 0;align-items:stretch}
.o-h2 .rod{bottom:calc(100% - 8px);height:76px}
.h2a{padding:89px 55px 55px}
.h2a .rod.a{left:16%}.h2a .rod.b{right:16%}
.h2a .acts{margin-top:34px}
.h2b{display:flex;flex-direction:column;justify-content:space-between;padding:34px;--pl:var(--ink);--pi:var(--pap);--pm:rgba(247,242,231,.65);--fr:var(--ink);cursor:pointer}
[data-col="carbon"] .h2b{--pl:var(--pap);--pi:var(--ink);--pm:rgba(32,37,33,.65);--fr:var(--pap)}
.h2b .rod.a{left:22%}.h2b .rod.b{right:22%}
.h2b-ic{display:grid;place-items:center;width:89px;height:89px;border-radius:50%;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pi) 25%,transparent);font-size:42px}
.h2b b{font-family:var(--display);font-stretch:87.5%;font-weight:650;text-transform:uppercase;font-size:42px;line-height:.95}
.h2b .num{font-family:var(--mono);font-size:16px;letter-spacing:.06em;color:var(--pm);display:flex;justify-content:space-between;align-items:center}

/* ---------- H3 · Chain: the head sign, the board ---------- */
.o-h3 .sign{position:relative;width:1180px;margin:21px auto 0;display:flex;flex-direction:column;align-items:center}
.h3-main{width:100%;padding:55px 89px}
.o-h3 .ch2{width:144px;height:21px}

/* ---------- N1 · Help point ---------- */
.o-n1 .in,.o-n4 .in{display:grid;grid-template-columns:1fr 340px;gap:89px;height:100%;padding:0 89px 34px}
.o-n1 .in{align-items:center}
.cp .q{font-size:110px;line-height:.88}
.cp .ld{color:rgba(32,37,33,.75);font-size:20px}
.cp .lk{margin-top:34px;color:var(--ink)}

/* ---------- N4 · Chain + help point ---------- */
.o-n4 .in{align-items:start}
.o-n4 .cp{align-self:center;padding-bottom:34px}
.o-n4 .hang{display:flex;flex-direction:column;align-items:center;margin-top:21px;transform-origin:50% 0}
.o-n4 .ch2{width:180px;height:21px}
.o-n4 .hp .w,.o-n4 .hp-lab{display:none} /* the head sign carries the W and the name */
.o-n4 .hp{padding-top:34px}
/* compact: the head sign and the card become one piece, the sign its header */
[data-sz="s"] .o-n4 .ch2{display:none}
[data-sz="s"] .o-n4 .hd{width:340px;height:55px;border-radius:21px 21px 0 0;box-shadow:var(--hf)}
[data-sz="s"] .o-n4 .hd .w{border-radius:21px 0 0 0}
[data-sz="s"] .o-n4 .hp{border-radius:0 0 21px 21px;padding-top:34px}

/* ---------- phones ---------- */
@container (width < 600px){
  .faq{left:20px;right:20px}.faq div{font-size:16px}
  .foot{padding:0 20px;font-size:20px;height:55px}
  .opt{top:170px;bottom:55px;padding:0 20px}
  .sign{transform:none}
  .q,.cp .q{font-size:42px}
  .ld,.cp .ld{font-size:16px}
  .cnt{grid-template-columns:1fr;gap:21px}
  .acts{flex-direction:column;align-items:stretch;gap:21px}
  .call{font-size:16px}
  .o-p1 .sign,.o-h2 .sign{margin-inline:0}
  .p1-a,.p3-a,.h2a,.h3-main{padding:55px 21px 21px}
  .p1-b{padding:0 21px}.p1-b .lab{display:none}
  .post.b{display:none}.post.a{left:calc(50% - 10px)!important}
  .o-p3 .sign{width:auto}.p3-row{grid-template-columns:47px 1fr 21px;height:55px;padding-right:13px}.p3-row em{display:none}.p3-row b{font-size:16px}.p3-row .ri{width:47px;height:47px;font-size:21px}
  .rod.b{display:none}.rod.a{left:calc(50% - 2px)!important}
  .o-h2 .sign{grid-template-columns:1fr;gap:55px}.h2b{flex-direction:row;align-items:center;gap:21px;padding:21px}.h2b-ic{width:55px;height:55px;font-size:26px}.h2b b{font-size:26px}.h2b .num{display:none}
  .o-h3 .sign{width:auto}
  .o-n1 .in,.o-n4 .in{grid-template-columns:1fr;gap:34px;padding:0}
  .hp,[data-sz="s"] .o-n4 .hd{width:100%}
  .o-n4 .hang{order:-1}
}
</style>
</head>
<body>
<header class="top">
  <div><div class="id">Review · HE-02 · round 4</div><h1>Help page: the closing CTA</h1></div>
  <div class="tools" data-g="o">
    <button class="tbtn" data-v="n1">N1 Help point</button>
    <button class="tbtn" data-v="n4">N4 Chain + help point</button>
    <button class="tbtn" data-v="p1">P1 Pylon</button>
  </div>
</header>
<div class="top">
  <div class="tools" data-g="col"><span class="id">Plate</span><button class="tbtn" data-v="paper" data-name="Paper plate">Paper</button><button class="tbtn" data-v="carbon" data-name="Carbon plate">Carbon</button><button class="tbtn" data-v="rust" data-name="Rust plate">Rust</button><button class="tbtn" data-v="camel" data-name="Camel plate">Camel</button><button class="tbtn" data-v="yellow" data-name="Yellow plate">Yellow</button></div>
  <div class="tools" data-g="hc"><span class="id">Head colour</span><button class="tbtn" data-v="carbon" data-name="Carbon head">Carbon</button><button class="tbtn" data-v="paper" data-name="Paper head">Paper</button><button class="tbtn" data-v="rust" data-name="Rust head">Rust</button></div>
  <div class="tools" data-g="hd"><span class="id">Head</span><button class="tbtn" data-v="label" data-name="Label">Label</button><button class="tbtn" data-v="dots" data-name="Dots">Dot matrix</button></div>
  <div class="tools" data-g="sz"><span class="id">Card</span><button class="tbtn" data-v="s" data-name="Compact card">Compact</button><button class="tbtn" data-v="m" data-name="Regular card">Regular</button><button class="tbtn" data-v="l" data-name="Tall card">Tall</button></div>
  <div class="tools" data-g="em"><span class="id">Email us</span><button class="tbtn" data-v="left" data-name="Email beside the question">Left</button><button class="tbtn" data-v="link" data-name="Email as a link on the card">Card link</button><button class="tbtn" data-v="key" data-name="Email as a second key">Second key</button></div>
  <div class="tools" data-g="ln"><span class="id">Card line</span><button class="tbtn" data-v="plain" data-name="No number on the card">Plain</button><button class="tbtn" data-v="number" data-name="The number on the card">Number</button></div>
  <div class="tools" data-g="lamp"><span class="id">Lamp</span><button class="tbtn" data-v="on" data-name="Status lamp">On</button><button class="tbtn" data-v="off" data-name="No lamp">Off</button></div>
  <div class="tools" data-g="view"><span class="id">View</span><button class="tbtn" data-v="flat">Flat</button><button class="tbtn" data-v="angled">Angled</button><button class="tbtn" data-v="reverse">Reverse</button></div>
  <div class="tools" data-g="ang"><span class="id">Angle</span><button class="tbtn" data-v="2">2°</button><button class="tbtn" data-v="4">4°</button><button class="tbtn" data-v="8">8°</button></div>
  <div class="tools" data-g="s"><span class="id">Desk</span><button class="tbtn" data-v="open" aria-pressed="true">Open</button><button class="tbtn" data-v="closed">Closed</button></div>
  <div class="tools" data-g="d"><span class="id">Device</span><button class="tbtn" data-v="desktop" aria-pressed="true">Desktop</button><button class="tbtn" data-v="phone">Phone</button></div>
</div>
<section class="score" id="score" aria-label="Scores"></section>

<template id="t-cnt"><div class="cnt"><div><h2 class="q">Still have a question?</h2><p class="ld">Call us. A person answers, 8 AM – 8 PM, every day.</p></div><div class="acts"><a class="call"><span class="ci"><i data-i="call"></i></span>Call +1 647 877 1411</a><a class="lk"><i data-i="mail"></i>Email us</a></div></div></template>
<template id="t-hd"><div class="hd"><span class="w"><i data-i="w"></i></span><span class="hd-f"><span class="lab">Help desk</span><span class="dm"></span></span></div></template>
<template id="t-hp"><div class="pl hp"><span class="w"><i data-i="w"></i></span><span class="lamp" title="Desk open"></span><span class="hp-lab">Help<br>point</span><span class="hp-grille"></span>
  <div class="keys"><a class="key k-call"><span class="hp-btn"><b><i data-i="call"></i></b></span><span class="kl">Press to call</span></a><a class="key k-mail"><span class="hp-btn sm"><b><i data-i="mail"></i></b></span><span class="kl">Email us</span></a></div>
  <small class="num">+1 647 877 1411</small><a class="lk em-link"><i data-i="mail"></i>Email us</a></div></template>
<template id="t-cp"><div class="cp"><h2 class="q">Still have a question?</h2><p class="ld">Call us. A person answers, 8 AM – 8 PM, every day.</p><a class="lk cp-mail"><i data-i="mail"></i>Email us</a></div></template>

<div class="wrap"><div class="stage" id="st" data-o="n1" data-s="open" data-col="paper" data-hc="carbon" data-hd="dots" data-sz="m" data-em="key" data-ln="plain" data-lamp="on">
  <div class="faq"><div><span>Do you bring your own supplies?</span><span>+</span></div><div><span>Can I change my date?</span><span>+</span></div></div>

  <section class="opt o-p1"><div class="sign">
    <span class="post a"></span><span class="post b"></span>
    <div class="pl bolts p1-a"><span class="w"><i data-i="w"></i></span><div data-t="cnt"></div></div>
    <div class="pl bolts p1-b"><span class="st"><i></i><span class="open">A person answers now</span><span class="closed">Back at 8 AM</span></span><span class="lab">8 AM – 8 PM · every day</span></div>
  </div></section>

  <section class="opt o-n1"><div class="in">
    <div data-t="cp"></div>
    <div class="sign"><div data-t="hp"></div></div>
  </div></section>

  <section class="opt o-n4"><span class="rail"></span><div class="in">
    <div data-t="cp"></div>
    <div class="hang sign">
      <span class="ch" style="height:21px"></span>
      <div data-t="hd"></div>
      <span class="ch2"><i></i><i></i></span>
      <div data-t="hp"></div>
    </div>
  </div></section>

  <div class="foot">We’ll take it from here.</div>
</div></div>

<script src="dots.js"></script>
<script src="score.js"></script>
<script>
(function () {
  const IC = {
    call: '<svg class="ic" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5" d="m9.159 5.712l-.403-.906c-.263-.592-.395-.888-.592-1.115a2 2 0 0 0-.928-.603C6.949 3 6.625 3 5.976 3c-.948 0-1.422 0-1.82.182a2.12 2.12 0 0 0-1.061 1.169c-.143.413-.102.838-.02 1.689q1.310 13.575 14.886 14.885c.85.082 1.275.123 1.689-.02a2.12 2.12 0 0 0 1.168-1.06c.182-.399.182-.873.182-1.821c0-.649 0-.973-.088-1.26a2 2 0 0 0-.603-.928c-.226-.197-.523-.328-1.115-.592l-.906-.402c-.642-.285-.962-.428-1.288-.459a2 2 0 0 0-.919.128c-.305.119-.574.343-1.114.793c-.537.447-.805.67-1.133.79a2.16 2.16 0 0 1-.981.101c-.346-.05-.61-.192-1.14-.475c-1.645-.88-2.553-1.787-3.433-3.433c-.283-.53-.424-.794-.475-1.14a2.16 2.16 0 0 1 .1-.98c.12-.329.344-.597.791-1.134c.45-.54.675-.809.793-1.114c.114-.292.158-.607.128-.919c-.03-.326-.173-.646-.459-1.288Z"/></svg>',
    mail: '<svg class="ic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"><path d="m2 6l6.913 3.917c2.549 1.444 3.625 1.444 6.174 0L22 6"/><path d="M2.016 13.476c.065 3.065.098 4.598 1.229 5.733c1.131 1.136 2.705 1.175 5.854 1.254c1.94.05 3.862.05 5.802 0c3.149-.079 4.723-.118 5.854-1.254c1.131-1.135 1.164-2.668 1.23-5.733c.02-.986.02-1.966 0-2.952c-.066-3.065-.099-4.598-1.23-5.733c-1.131-1.136-2.705-1.175-5.854-1.254a115 115 0 0 0-5.802 0c-3.149.079-4.723.118-5.854 1.254c-1.131 1.135-1.164 2.668-1.230 5.733a69 69 0 0 0 0 2.952Z"/></g></svg>',
    r: '<svg class="ic" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.5 12H5m8 6s6-4.419 6-6s-6-6-6-6"/></svg>',
    w: '<svg viewBox="-2 -2 88 86"><path fill="currentColor" d="M0,80C.14,77.73-.02,11.64.03,9.23l11.67-1.12s.01,40.19-.1,55.51c20.63-10.95,25.77-37.76,25.47-59.5,2.65-.22,9.1-.87,11.81-1.15-.51,20.26,3.46,45.8,24.97,53.64.05-15.31.05-40.2.07-55.53l11.65-1.08v70.04c-17.66,4.6-35.16-10.2-42.26-25.54-7.02,17.45-23.22,35.59-43.32,35.5Z"/></svg>'
  };
  document.querySelectorAll('[data-t]').forEach((n) => n.replaceWith(document.getElementById('t-' + n.dataset.t).content.cloneNode(true)));
  document.querySelectorAll('[data-i]').forEach((n) => { const t = document.createElement('template'); t.innerHTML = IC[n.dataset.i]; const s = t.content.firstChild; if (n.className) s.classList.add(...n.className.split(' ')); n.replaceWith(s); });

  const st = document.getElementById('st');
  // the head's dots, drawn to whatever box the field has (it changes with the card height and the head colour)
  const lit = () => document.querySelectorAll('.hd .dm').forEach((d) => { if (d.offsetParent) dotField(d, 'HELP DESK', { pitch: 2.5 }); });
  let view = 'flat', ang = 4;
  const angle = () => st.style.setProperty('--ang', `${view === 'flat' ? 0 : view === 'angled' ? ang : -ang}deg`);
  const set = { view: (v) => { view = v; angle(); }, ang: (v) => { ang = +v; angle(); }, d: (v) => document.body.classList.toggle('dev-phone', v === 'phone') };
  document.querySelectorAll('[data-g]').forEach((g) => g.addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    g.querySelectorAll('[data-v]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    (set[g.dataset.g] || ((v) => (st.dataset[g.dataset.g] = v)))(b.dataset.v); fit(); lit();
  }));
  const wrap = document.querySelector('.wrap');
  function fit() { const k = Math.min(1, wrap.clientWidth / st.offsetWidth); st.style.transform = `scale(${k})`; wrap.style.height = `${st.offsetHeight * k}px`; }
  addEventListener('resize', () => { fit(); lit(); }); fit();

  /* Scores (0–100). Read on three things: the layout (one clear object, or several competing), the colour (a Help page
     should feel calm: Paper and Carbon do; Rust reads as an alert there, Yellow breaks the signal rule) and the message
     (does any piece repeat another? "Help desk" over "Help point", or "Call" said three times, costs). */
  const hung = { view: { flat: 0, angled: -3, reverse: -4 }, ang: { 2: 0, 4: -2, 8: -8 } };
  const headPair = (st) => (st.hd === 'dots' ? (st.hc === 'carbon' ? 4 : st.hc === 'paper' ? 1 : -1) : 0) + (st.hc === 'rust' ? -4 : st.hc === 'carbon' ? 1 : 0);
  Score({
    key: 'o', preferred: 'n1',
    common: { col: { paper: 2, carbon: 1, rust: -5, camel: -3, yellow: -10 }, view: { flat: 0, angled: -1, reverse: -2 }, ang: { 2: 1, 4: -1, 8: -6 },
      em: { left: 0, link: 2, key: 3 }, ln: { plain: 2, number: 0 }, lamp: { on: 1, off: 0 } },
    styles: {
      n1: { name: 'N1 Help point', base: 82, uses: ['col', 'sz', 'em', 'ln', 'lamp', 'view', 'ang'], mods: { sz: { s: -1, m: 2, l: -1 }, view: { angled: 0, reverse: -1 }, ang: { 2: 1 } },
        note: "Your pick, and the cleanest page: the question on the paper, everything you can do on the card. Email as a second, smaller key makes it a real intercom (call, or write) and leaves the left side to the question alone. No number or hours on the card: the line already says 8 AM – 8 PM, and the lamp says whether someone's in without words." },
      n4: { name: 'N4 Chain + help point', base: 76, uses: ['col', 'hc', 'hd', 'sz', 'em', 'ln', 'lamp', 'view', 'ang'], mods: { sz: { s: 4, m: 0, l: -3 }, em: { link: 2, key: 1 }, view: { angled: -3, reverse: -4 }, ang: { 2: 0, 4: -2, 8: -8 } },
        pair: (st) => (st.hd === 'dots' ? (st.hc === 'carbon' ? 4 : st.hc === 'paper' ? 1 : -1) : 0) + (st.hc === 'rust' ? -4 : st.hc === 'carbon' ? 1 : 0) + (st.lamp === 'on' && st.hd === 'dots' ? -2 : 0),
        note: 'More branded (the lit HELP DESK), but now that the card says everything itself, the sign is a second object saying the same thing. Two keys crowd the compact card, so the card link suits it; with the dots lit, the lamp is one light too many.' },
      p1: { name: 'P1 Pylon', base: 75, uses: ['col', 'view', 'ang'], note: "Solid and clear, but it is the About page's closing almost exactly, so the site repeats itself." }
    }
  });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(lit);
})();
</script>
</body>
</html>
